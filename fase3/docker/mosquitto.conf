# ponytail: anônimo e sem TLS, só para o lab na rede local.
# Em produção: password_file + acl_file + listener 8883 com certificados.
listener 1883
allow_anonymous true

# WebSocket para o painel web (navegador não fala MQTT/TCP)
listener 9001
protocol websockets

# Ponte para o HiveMQ público: traz para o lab local o que o ESP32 do Wokwi
# publica na internet (o Wokwi web não alcança o localhost). Só entrada (in).
connection hivemq
address broker.hivemq.com:1883
topic cardioia/g7f3a/# in 0
remote_clientid cardioia-lab-bridge-7f3a
cleansession true
try_private false
bridge_protocol_version mqttv311
# O HiveMQ derruba quem publica em $SYS (aviso padrão da ponte); sem isso a ponte cai em loop.
notifications false
